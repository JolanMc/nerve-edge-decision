[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "nerve-edge-decision"
version = "0.1.0"
description = "Runtime monitor for INT8 neural networks on the edge: out-of-distribution inputs and bit flips in the weights, with measured costs."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "Apache-2.0" }
authors = [{ name = "Jolan Mocanu", email = "jolan.mocanu@gmail.com" }]
keywords = ["edge-ai", "int8", "quantization", "out-of-distribution", "runtime-monitoring", "fault-injection", "single-event-upset", "onnxruntime", "earth-observation"]
classifiers = [
    "License :: OSI Approved :: Apache Software License",
    "Programming Language :: Python :: 3",
    "Topic :: Scientific/Engineering :: Artificial Intelligence",
]
dependencies = [
    "numpy>=1.26",
    "scipy>=1.11",
    "scikit-learn>=1.3",
    "onnx>=1.16",
    "onnxruntime>=1.18",
    "sympy>=1.12",  # symbolic shape inference in ONNX Runtime's quantisation pre-processing
    "pillow>=10",
    "py7zr>=0.20",
    "matplotlib>=3.8",
]

[project.optional-dependencies]
train = ["torch>=2.3"]
dev = ["pytest>=8", "ruff>=0.6"]
demo = ["gradio>=5"]

[project.urls]
Repository = "https://github.com/JolanMc/nerve-edge-decision"
"Related project" = "https://github.com/JolanMc/Jorak"

[tool.setuptools.packages.find]
include = ["nerve_edge*"]

[tool.ruff]
line-length = 120
target-version = "py310"

[tool.ruff.lint]
select = ["E", "F", "I", "B", "UP"]
ignore = ["E501", "B008"]

[tool.pytest.ini_options]
testpaths = ["tests"]
